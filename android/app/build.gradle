plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}


import com.android.build.OutputFile

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def keystoreFile = System.getenv('KEY_PATH')
if (keystoreFile != null && !keystoreFile.isEmpty()) {
    keystoreProperties.setProperty('storePassword', System.getenv('KEY_STORE_PASSWORD'));
    keystoreProperties.setProperty('keyPassword', System.getenv('KEY_PASSWORD'));
    keystoreProperties.setProperty('keyAlias', System.getenv('KEY_ALIAS'));
    keystoreProperties.setProperty('storeFile', System.getenv('KEY_PATH'));
}

android {
    namespace 'com.teskann.quax'
    compileSdkVersion 36
    ndkVersion = "30.0.16248370"

    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lint {
        disable 'InvalidPackage'
    }

    defaultConfig {
        applicationId "com.fannndi.quaxre"
        minSdkVersion flutter.minSdkVersion
        // 36, matching Flutter's own FlutterExtension and every plugin
        // (better_player_plus compiles against 36). On Android 11+ the library
        // uses MANAGE_EXTERNAL_STORAGE; on Android 10 devices the legacy flag
        // below is still honoured, which is why both routes exist.
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // java-time APIs used by media plugins.
        coreLibraryDesugaringEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
        }

        // Declared explicitly because the flutter-gradle-plugin does not
        // initialize it from release. Without this a profile build got AGP's
        // defaults: no minifyEnabled and no shrinkResources, so it never
        // exercised the R8 path a release build runs (a missing media3 keep
        // rule is invisible until release), and it was signed with the debug
        // config — so `adb install -r app-arm64-v8a-profile.apk`, the workflow
        // AGENTS.md documents, installs a debug-signed APK that cannot coexist
        // with a release-signed one of the same applicationId.
        profile {
            signingConfig signingConfigs.release
            // AGP 9 does not feed Flutter plugin subproject classes into R8 for a
            // custom build type: minifying here yields an APK whose
            // GeneratedPluginRegistrant cannot find any plugin. Keep the release
            // signing so `adb install -r` does not fight a debug-signed build; the
            // release build type is the minified one that exercises these rules.
            minifyEnabled = false
            shrinkResources = false
        }

        release {
            signingConfig signingConfigs.release

            // An all-null release signing config makes AGP fall back to the
            // *debug* keystore, and the build succeeds silently: the app id gets
            // claimed by a key nobody meant to ship. Refuse instead. Gradle
            // configures every build type, so this guard also gates profile
            // (signed with signingConfigs.release) and debug builds — provide
            // android/key.properties or the KEY_* env vars once.
            if (signingConfigs.release.storeFile == null) {
                throw new GradleException(
                    "Release builds need a keystore: create android/key.properties " +
                    "(storeFile/storePassword/keyAlias/keyPassword) or set KEY_PATH, " +
                    "KEY_STORE_PASSWORD, KEY_PASSWORD and KEY_ALIAS. " +
                    "Refusing to fall back to the debug signing config."
                )
            }

            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    def abiName = output.getFilter(OutputFile.ABI)
                    if (abiName == null) {
                        outputFileName = "quax-v${defaultConfig.versionName}.apk"
                    } else {
                        outputFileName = "quax-v${defaultConfig.versionName}_${abiName}.apk"
                    }
                }
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}

ext.abiCodes = ["x86_64": 1, "armeabi-v7a": 2, "arm64-v8a": 3]
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode + abiVersionCode
        }
    }
}
